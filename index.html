<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>13 Assyrian Monks in Georgia</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Google Fonts: Prata & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prata&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Prata', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1ede4; }
    ::-webkit-scrollbar-thumb { background: #cbbba6; border-radius: 9999px; }

    .custom-marker {
      width: 30px; height: 30px; border-radius: 50%;
      background: #92400e; border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35); display: flex;
      align-items: center; justify-content: center; color: #fef3c7;
      cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .custom-marker:hover, .custom-marker.active {
      transform: scale(1.35); background: #b45309; border-color: #fef3c7;
    }

    .maplibregl-popup-content {
      background: #ffffff; border-radius: 12px; padding: 0 !important;
      box-shadow: 0 16px 32px -4px rgba(0,0,0,0.25); font-family: 'Inter', sans-serif;
      max-width: 275px; overflow: hidden; border: 1px solid #ebd9c8;
    }
    .maplibregl-popup-close-button {
      padding: 4px 8px; font-size: 18px; color: #ffffff !important;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9); z-index: 20;
    }
  </style>
</head>
<body class="bg-[#f7f4ee] text-stone-800 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-stone-900 text-stone-100 px-5 py-3 border-b border-stone-800 shrink-0 flex items-center justify-between z-20 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-full bg-amber-700 border border-amber-500/40 flex items-center justify-center text-amber-200 shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M7 8h10M8 15h8"/></svg>
      </div>
      <div>
        <h1 class="font-serif text-base md:text-lg font-bold tracking-wide text-amber-100">13 Assyrian Monks in Georgia</h1>
        <p class="text-[11px] text-stone-400">6th Century Monastic Founders</p>
      </div>
    </div>
  </header>

  <!-- Filter & Search Bar -->
  <section class="bg-[#eee8dc] px-4 py-2 border-b border-stone-300 flex flex-wrap gap-2 items-center justify-between text-xs shrink-0 z-20">
    <div class="relative flex-1 min-w-[200px] max-w-sm">
      <input 
        id="search-input" 
        type="text" 
        placeholder="Filter by monk, monastery, or region..." 
        class="w-full bg-white pl-8 pr-3 py-1.5 rounded-md border border-stone-300 focus:outline-none focus:ring-1 focus:ring-amber-600 text-stone-700 shadow-sm"
      />
      <svg class="w-3.5 h-3.5 text-stone-400 absolute left-2.5 top-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <div class="flex items-center gap-2">
      <button id="reset-btn" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md bg-stone-200/90 hover:bg-stone-300 text-stone-700 font-medium transition cursor-pointer text-xs">
        <svg class="w-3.5 h-3.5 text-amber-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Reset View</span>
      </button>
      <span id="counter" class="text-stone-500 font-medium text-xs">0 Monasteries</span>
    </div>
  </section>

  <!-- Main Content Layout -->
  <main class="flex-1 flex flex-col md:flex-row min-h-0 relative overflow-hidden">
    <div class="order-1 h-[60%] md:h-full md:w-[440px] lg:w-[480px] shrink-0 overflow-y-auto p-3.5 space-y-3 bg-[#f7f4ee] border-b md:border-b-0 md:border-r border-stone-300">
      <div id="monks-list" class="space-y-3"></div>
    </div>
    <div class="order-2 h-[40%] md:h-full flex-1 relative bg-stone-200 min-h-0">
      <div id="map" class="absolute inset-0 w-full h-full"></div>
    </div>
  </main>

  <!-- Подключение модульного JS -->
  <script type="module" src="js/app.js"></script>
  <!-- Центральная детальная карточка святого (по макету) -->
<div 
  id="monk-detail-modal" 
  class="hidden fixed top-8 left-[380px] z-30 w-[360px] max-h-[calc(100vh-64px)] bg-white rounded-2xl shadow-2xl border border-stone-200 overflow-hidden flex flex-col font-sans transition-all duration-300"
>
  <!-- Кнопка закрытия (крестик) -->
  <button 
    id="close-modal-btn" 
    type="button"
    class="absolute top-4 right-4 text-stone-400 hover:text-stone-900 transition-colors z-10 p-1"
    aria-label="Close"
  >
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </button>

  <!-- Скроллируемый контент -->
  <div class="overflow-y-auto p-8 text-center flex-1">
    <!-- Номер святого -->
    <span id="modal-monk-index" class="font-serif text-2xl text-stone-900 block mb-2 select-none">
      2
    </span>

    <!-- Имя монаха -->
    <h2 id="modal-monk-name" class="font-serif text-3xl text-stone-900 leading-snug font-normal mb-6">
      Anton of Martqopi
    </h2>

    <!-- Большая круглая икона -->
    <div class="w-36 h-36 mx-auto rounded-full overflow-hidden bg-stone-100 border-2 border-stone-200 shadow-inner mb-6 flex items-center justify-center">
       <img id="modal-monk-icon" src="" alt="" class="w-full h-full object-cover" onerror="this.onerror=null; this.style.display='none';" />
    </div>

    <!-- Текстовое жизнеописание -->
    <div id="modal-monk-desc" class="text-left text-xs text-stone-600 leading-relaxed space-y-3 font-normal mb-6">
      <!-- Текст подставится через JS -->
    </div>
  </div>

  <!-- Прижатая снизу кнопка Google Maps -->
  <div class="p-4 bg-white/90 backdrop-blur-sm border-t border-stone-100 flex justify-center">
    <a 
      id="modal-monk-gmaps" 
      href="#" 
      target="_blank" 
      rel="noopener noreferrer"
      class="inline-flex items-center gap-2 px-6 py-2.5 bg-stone-900 hover:bg-stone-800 text-white rounded-full text-xs font-medium shadow-md transition-all active:scale-95"
    >
      <span>Open in Google Maps</span>
      <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
  </div>
</div>
</body>
</html>
