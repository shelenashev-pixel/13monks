<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e0d5c1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>13 Assyrian Monks in Georgia</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Google Fonts: Prata & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prata&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Prata', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --paper: #f5f2eb;
      --ink: #111111;
      --muted: #777777;
    }

    * { box-sizing: border-box; }
    html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #e0d5c1;
    }
    body {
      margin: 0; padding: 0; width: 100%; height: 100lvh;
      position: relative; background-color: #e0d5c1; overscroll-behavior: none;
    }
    .hidden { display: none !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c9c6bd; border-radius: 9999px; }

    #map {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100vw !important;
      height: 100lvh !important;
      background-color: #e0d5c1;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #e0d5c1 0%,
        rgba(224, 213, 193, 0) 36px,
        rgba(224, 213, 193, 0) calc(100% - 36px),
        #e0d5c1 100%
      );
    }
    .app-header {
      position: fixed; z-index: 20; inset: 0 0 auto; min-height: 72px;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 12px 16px; pointer-events: none;
    }
    .app-title {
      margin: 0; color: var(--ink); font: 400 clamp(26px, 3.4vw, 43px)/1.1 'Prata', Georgia, serif;
      letter-spacing: -1.2px; text-shadow: 0 1px 8px rgba(255,255,255,.38);
      max-width: 620px;
    }
    .header-actions { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
    .reset-btn {
      min-width: 86px; padding: 11px 22px; border: 0; border-radius: 999px;
      background: #111; color: white; font: 500 13px Inter, sans-serif; cursor: pointer;
      transition: background .18s, transform .18s;
    }
    .reset-btn:hover { background: #333; transform: translateY(-1px); }
    .language-switch {
      display: flex; align-items: center; gap: 4px; padding: 5px;
      border: 1px solid rgba(0,0,0,.06); border-radius: 999px; background: rgba(255,255,255,.88);
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }
    .language-switch span {
      display: grid; width: 31px; height: 31px; place-items: center;
      border-radius: 50%; font-size: 16px;
    }
    .mobile-list-toggle, .mobile-list-close, .mobile-reset-btn { display: none; }

    .monks-panel {
      position: fixed; z-index: 10; top: 82px; bottom: 16px; left: 16px;
      display: flex; flex-direction: column; gap: 15px;
      width: min(434px, calc(100vw - 32px)); padding: 16px;
      border: 1px solid rgba(255,255,255,.8); border-radius: 16px;
      background: #f7f5ef; box-shadow: 0 10px 28px rgba(36,31,24,.08);
    }
    .panel-intro {
      flex: 0 0 auto; display: flex; align-items: center; margin: 0; padding: 8px 0;
      border: 0; border-radius: 0; color: var(--ink);
      background: transparent; font: 400 clamp(28px, 2.8vw, 39px)/1.08 'Prata', Georgia, serif;
      letter-spacing: -.8px;
    }
    .search-wrap { position: relative; flex: 0 0 41px; }
    .search-icon {
      position: absolute; top: 10px; left: 16px; width: 20px; height: 20px;
      color: #111; pointer-events: none;
    }
    #search-input {
      width: 100%; height: 100%; padding: 0 16px 0 46px; outline: none;
      border: 1px solid transparent; border-radius: 999px; background: #e9e7e2;
      color: var(--ink); font: 14px Inter, sans-serif;
    }
    #search-input:focus { border-color: #a4a09a; background: #f1efeb; }
    #search-input::placeholder { color: #777; }
    #monks-list { display: flex; flex: 1; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; padding: 0 0 2px; }
    .empty-state {
      display: flex; align-items: center; justify-content: center; min-height: 180px; padding: 20px 16px;
    }
    .empty-state-card {
      width: 100%; padding: 20px 18px; border: 1px solid #e6e0d7; border-radius: 12px; background: rgba(255,255,255,.72); text-align: center;
    }
    .empty-state-card h3 { margin: 0 0 8px; color: #171717; font: 400 24px/1.2 'Prata', Georgia, serif; }
    .empty-state-card p { margin: 0 0 14px; color: #666; font: 13px/1.5 Inter, sans-serif; }
    .empty-state-action {
      border: 0; border-radius: 999px; background: #171717; color: white; padding: 9px 16px; font: 600 12px Inter, sans-serif; cursor: pointer;
    }
    #counter { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .map-pin-wrap { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .map-pin {
      display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: rgba(17,17,17,.9);
      box-shadow: 0 4px 16px rgba(17,17,17,.18); color: #fff; font-size: 12px; line-height: 1; transform: scale(1); transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
    }
    .map-pin.is-active {
      background: #a77a43; box-shadow: 0 7px 18px rgba(167,122,67,.38); transform: scale(1.14);
    }
    .map-pin-wrap.is-active .map-pin { background: #a77a43; }

    .monk-card {
      display: grid; flex: 0 0 70px; grid-template-columns: 32px 44px minmax(0,1fr);
      align-items: center; gap: 10px; width: 100%; padding: 6px 8px;
      border: 1px solid rgba(17,17,17,.08); border-radius: 12px;
      background: rgba(255,255,255,.28); color: var(--ink); cursor: pointer;
      transition: background .18s, border-color .18s, box-shadow .18s, transform .18s;
    }
    .monk-card:hover {
      background: rgba(255,255,255,.72);
      border-color: rgba(17,17,17,.14);
    }
    .monk-card.is-active,
    .monk-card.border-stone-800,
    .monk-card[aria-current="true"] {
      border-color: rgba(23,23,23,.46) !important; background: #fff !important; box-shadow: 0 6px 18px rgba(17,17,17,.08) !important; transform: translateX(2px);
    }
    .card-number { color: #080808; font: 400 30px/1 'Prata', Georgia, serif; text-align: center; }
    .card-icon-frame {
      position: relative; display: grid; width: 44px; height: 44px; overflow: hidden; place-items: center;
      border-radius: 50%; background: #e8e6e0; color: #8a8882;
    }
    .card-icon-frame::after { position: absolute; content: '✝'; font-size: 20px; }
    .card-icon-frame img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
    .card-copy { min-width: 0; text-align: center; }
    .card-copy h3 {
      overflow: hidden; margin: 0; color: #111; font: 400 clamp(16px, 1.45vw, 21px)/1.12 'Prata', Georgia, serif;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .card-copy p { overflow: hidden; margin: 3px 0 0; color: var(--muted); font: 12px/1.25 Inter, sans-serif; text-overflow: ellipsis; white-space: nowrap; }

    .monk-detail-modal {
      position: fixed; z-index: 30; top: 84px; bottom: 16px;
      left: calc(32px + min(434px, calc(100vw - 32px)));
      display: flex; width: min(434px, calc(100vw - min(434px, calc(100vw - 32px)) - 48px)); max-height: none;
      flex-direction: column; overflow: hidden;
      border: 1px solid rgba(23,23,23,.08); border-radius: 18px; background: #fff;
      box-shadow: 0 12px 30px rgba(17,17,17,.08); transition: opacity .2s, transform .2s;
    }
    .modal-content { flex: 1; overflow-y: auto; padding: 30px 30px 18px; text-align: center; }
    .modal-close {
      position: absolute; top: 13px; right: 14px; z-index: 2; display: grid;
      width: 34px; height: 34px; place-items: center; padding: 0; border: 0;
      background: transparent; color: #111; cursor: pointer;
    }
    .modal-close:hover { color: #777; }
    #modal-monk-index { display: block; margin-bottom: 14px; color: #111; font: 400 25px/1 'Prata', Georgia, serif; }
    #modal-monk-name { margin: 0 0 30px; color: #080808; font: 400 clamp(28px, 3vw, 42px)/1.18 'Prata', Georgia, serif; }
    .modal-icon {
      display: block; width: 162px; height: 162px; margin: 0 auto 30px;
      border-radius: 50%; background: #eeece8; object-fit: cover; border: 5px solid rgba(255,255,255,.8); box-shadow: 0 10px 18px rgba(16,16,16,.08);
    }
    #modal-monk-desc { margin: 0; color: #777; font: 13px/1.5 Inter, sans-serif; text-align: left; }
    #modal-monk-desc p + p { margin-top: 8px; }
    #modal-monk-desc strong { color: #555; }
    .monk-popup-gmaps {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      margin-top: 12px; padding: 9px 14px; border-radius: 999px;
      background: #111; color: white; font: 500 11px Inter, sans-serif;
      text-decoration: none; transition: background .18s;
    }
    .monk-popup-gmaps:hover { background: #333; }
    .monk-popup-read {
      display: inline-flex; align-items: center; justify-content: center; min-height: 32px; padding: 7px 14px; border: 0; border-radius: 999px;
      background: #171717; color: white; font: 600 11px Inter, sans-serif; cursor: pointer;
    }
    .modal-footer { display: none; }
    .desktop-detail-nav { display: none; }
    .monk-popup-title-row { display: contents; }
    .monk-popup-icon { display: none; }

    .maplibregl-popup-content {
      width: 240px; padding: 0 !important; overflow: hidden; border-radius: 14px;
      background: #fff; box-shadow: 0 12px 24px rgba(18,18,18,.12);
      font-family: Inter, sans-serif;
    }
    .maplibregl-popup-close-button {
      z-index: 2; padding: 3px 8px; color: #fff !important; font-size: 19px;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    .maplibregl-popup-tip { border-top-color: white; border-bottom-color: white; }

    @media (min-width: 761px) {
      .app-header { padding: 26px 22px 20px 12px; }
      .app-header .app-title {
        position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .header-actions .language-switch { order: 1; }
      .header-actions .reset-btn { order: 2; }
      .monks-panel {
        top: 64px; bottom: 32px; left: 30px; width: min(330px, calc(100vw - 48px));
        gap: 12px; padding: 18px 16px; border: 1px solid rgba(17,17,17,.06); border-radius: 14px; background: #fff;
        box-shadow: 0 8px 22px rgba(0,0,0,.06);
      }
      .panel-intro { min-height: 82px; padding: 0 0 4px; font-size: clamp(29px, 2.7vw, 38px); }
      .monk-card {
        border-color: transparent; border-radius: 8px; background: transparent;
        box-shadow: none;
      }
      .monk-card:hover { background: #f8f7f4; }
      .monk-card[aria-current="true"] {
        border-color: #787878 !important; background: #fff !important;
        box-shadow: 0 2px 6px rgba(0,0,0,.08) !important;
      }
      .card-copy h3 { font-size: 21px; }
      .monk-detail-modal {
        top: 64px; bottom: 32px;
        left: calc(42px + min(330px, calc(100vw - 48px)));
        width: min(330px, calc(100vw - min(330px, calc(100vw - 48px)) - 84px));
        border-radius: 16px; background: #fff;
      }
      .modal-content { padding: 28px 26px 72px; }
      .desktop-detail-nav {
        position: absolute; right: 0; bottom: 14px; left: 0; z-index: 2;
        display: flex; justify-content: center; gap: 12px; pointer-events: none;
      }
      .desktop-detail-nav button {
        display: grid; width: 44px; height: 44px; place-items: center;
        border: 0; border-radius: 50%; background: #f5f2eb; color: #171717;
        font: 400 24px/1 Inter, sans-serif; cursor: pointer; pointer-events: auto;
      }
      .desktop-detail-nav button:hover { background: #e9e2d6; }
      #modal-monk-index { margin-bottom: 16px; }
      #modal-monk-name { margin-bottom: 24px; font-size: 30px; }
      .modal-icon { width: 140px; height: 140px; margin-bottom: 24px; }
      #modal-monk-desc { text-align: center; }
      .custom-monk-popup .monk-popup-image { height: 150px; }
      .custom-monk-popup .monk-popup-details { padding: 18px 14px 14px; }
      .custom-monk-popup .monk-popup-title {
        margin: 0 0 6px; font-size: 22px; line-height: 1.2;
      }
      .custom-monk-popup .monk-popup-region { margin: 0 0 12px; font-size: 12px; }
      .custom-monk-popup .monk-popup-summary { font-size: 12px; line-height: 1.45; }
      .custom-monk-popup .monk-popup-gmaps {
        display: flex; width: min(185px, 100%); margin: 14px auto 0;
        padding: 12px 14px; background: #f0ede6; color: #111;
      }
    }

    @media (max-width: 760px) {
      body.monk-modal-open .maplibregl-popup { display: none; }
      .app-header {
        min-height: 112px; justify-content: center;
        padding: calc(13px + env(safe-area-inset-top)) 56px 10px;
      }
      .app-title {
        max-width: 260px; font-size: 25px; line-height: 1.15;
        text-align: center; letter-spacing: -.4px;
      }
      .header-actions { position: static; }
      .header-actions .reset-btn {
        position: absolute; top: calc(80px + env(safe-area-inset-top)); left: 50%; display: block; min-width: 0;
        min-height: 40px; padding: 0 18px; transform: translateX(-50%);
        background: #fff; color: #171717; font-size: 15px;
      }
      .header-actions .reset-btn:hover { background: #f0ede6; transform: translateX(-50%); }
      .language-switch {
        position: absolute; top: calc(15px + env(safe-area-inset-top)); right: 12px; display: flex;
        width: 44px; height: 44px; align-items: center; justify-content: center;
        padding: 0; border: 0; border-radius: 50%; background: white;
        box-shadow: 0 2px 10px rgba(0,0,0,.12);
      }
      .language-switch span { display: none; }
      .language-switch span:first-child { display: grid; width: 100%; height: 100%; font-size: 20px; }
      .mobile-list-toggle {
        position: absolute; top: calc(15px + env(safe-area-inset-top)); left: 12px;
        display: grid; width: 44px; height: 44px; place-items: center;
        padding: 0; border: 0; border-radius: 50%; background: white;
        color: #111; box-shadow: 0 2px 10px rgba(0,0,0,.12); cursor: pointer;
      }
      .mobile-list-toggle svg { width: 22px; height: 22px; }
      .monks-panel {
        z-index: 35; top: 0; right: 0; bottom: 0; left: 0; display: none;
        width: 100%; height: auto; gap: 12px;
        padding: calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
        border: 0; border-radius: 0; background: #f7f5ef;
        box-shadow: none;
      }
      body.mobile-list-open .monks-panel { display: flex; }
      body.mobile-list-open .app-header { display: none; }
      .mobile-list-close {
        position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 18px;
        display: grid; flex: 0 0 44px; width: 44px; height: 44px;
        place-items: center; padding: 0; border: 0; border-radius: 50%;
        background: white; color: #171717; box-shadow: 0 2px 10px rgba(0,0,0,.08); cursor: pointer;
      }
      .mobile-list-close svg { width: 20px; height: 20px; }
      .panel-intro {
        flex: 0 0 auto; align-self: center; justify-content: center;
        width: min(300px, 100%); min-height: 56px; margin: 14px 0 8px; padding: 0 28px;
        border: 0; border-radius: 0; text-align: center; font-size: 22px; line-height: 1.05;
      }
      .mobile-reset-btn {
        display: none;
        align-self: flex-start; padding: 0; border: 0; background: transparent;
        color: #777; font: 12px Inter, sans-serif; text-decoration: underline; cursor: pointer;
      }
      .search-wrap { flex-basis: 44px; }
      .search-icon { top: 9px; left: 13px; width: 19px; height: 19px; }
      #search-input { padding-left: 40px; font-size: 16px; }
      .empty-state-card p { font-size: 16px; }
      .empty-state-action { min-height: 44px; padding: 0 18px; font-size: 15px; }
      #monks-list { gap: 3px; padding-bottom: env(safe-area-inset-bottom); }
      .monk-card {
        flex: 0 0 62px; grid-template-columns: 30px 44px minmax(0,1fr);
        gap: 8px; padding: 6px 8px; border: 1px solid transparent;
        border-radius: 8px; background: transparent;
      }
      .monk-card:hover { background: #f8f6f1; }
      .monk-card[aria-current="true"] { border-color: #888 !important; background: #fff !important; box-shadow: 0 2px 6px rgba(0,0,0,.06) !important; }
      .card-number { display: block; font-size: 25px; }
      .card-icon-frame { width: 42px; height: 42px; }
      .card-copy { text-align: left; }
      .card-copy h3 { font-size: 19px; }
      .card-copy p { margin-top: 4px; font-size: 16px; }
      .map-pin-wrap { width: 40px; height: 40px; }
      .map-pin { width: 36px; height: 36px; font-size: 16px; transform: none; }
      .map-pin.is-active { transform: none; }
      .maplibregl-ctrl-group button { width: 40px; height: 40px; }
      body.mobile-list-open .mobile-list-toggle { visibility: hidden; }
      #mobile-card-overlay {
        position: fixed; z-index: 25; right: 0; bottom: calc(8px + env(safe-area-inset-bottom)); left: 0;
        overflow: hidden; pointer-events: none; contain: layout paint;
      }
      #mobile-card-overlay[hidden] { display: none; }
      body.monk-modal-open #mobile-card-overlay { visibility: hidden; }
      .mobile-monk-carousel {
        display: flex; width: 100%; gap: 14px; overflow-x: auto; overflow-y: visible;
        padding: 0 calc((100% - min(82vw, 620px)) / 2);
        scroll-snap-type: x mandatory; scrollbar-width: none;
        -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; touch-action: pan-x;
        pointer-events: auto;
      }
      .mobile-monk-carousel::-webkit-scrollbar { display: none; }
      .mobile-monk-card {
        position: relative; display: flex; flex: 0 0 min(82vw, 620px);
        height: min(42vh, 620px); height: min(42svh, 620px); min-height: 320px; flex-direction: column;
        overflow: hidden; border-radius: clamp(22px, 5vw, 40px); background: white;
        box-shadow: 0 5px 22px rgba(0,0,0,.2); scroll-snap-align: center; scroll-snap-stop: always;
      }
      .mobile-card-image { position: relative; flex: 0 0 46%; min-height: 120px; background: #e8e6e0; }
      .mobile-card-image > img { width: 100%; height: 100%; object-fit: cover; }
      .mobile-card-icon {
        position: absolute; z-index: 1; top: calc(46% - clamp(40px, 9.7vw, 70px)); left: 50%;
        width: clamp(80px, 19.4vw, 140px); height: clamp(80px, 19.4vw, 140px);
        transform: translateX(-50%); border: 4px solid white; border-radius: 50%;
        background: #eeece8; object-fit: cover;
      }
      .mobile-card-content {
        position: relative; display: flex; flex: 1; min-height: 0; flex-direction: column;
        align-items: center; padding: clamp(58px, 12vw, 88px) 5.5% 5.5%; text-align: center;
      }
      .mobile-card-name {
        max-width: 100%; margin: 0; color: #080808;
        font: 400 23px/1.2 'Prata', Georgia, serif;
      }
      .mobile-card-monastery { margin: 6px 0 0; color: #777; font: 16px/1.3 Inter, sans-serif; }
      .mobile-card-actions { display: flex; width: 100%; gap: 12px; margin-top: auto; }
      .mobile-card-read, .mobile-card-maps {
        display: flex; flex: 1; min-width: 0; min-height: 46px;
        align-items: center; justify-content: center; padding: 0 10px;
        border: 0; border-radius: 999px; font: 500 15px/1.15 Inter, sans-serif;
        text-decoration: none; text-align: center;
      }
      .mobile-card-maps span { overflow-wrap: anywhere; }
      .mobile-card-read { background: #171717; color: white; cursor: pointer; }
      .mobile-card-maps { background: #ddd3bd; color: #171717; }
      .mobile-card-maps span {
        display: block; width: 100%; text-align: center;
      }
      .maplibregl-ctrl-bottom-right { top: calc(50% - 105px); bottom: auto; }
      .monk-detail-modal {
        z-index: 30; top: 14vh; top: 14dvh; right: 0; bottom: 0; left: 0;
        width: 100%; max-height: none; transform: none;
        border: 0; border-radius: 24px 24px 0 0; background: white;
      }
      .modal-content { padding: 24px 22px 18px; text-align: center; }
      #modal-monk-index { margin-bottom: 15px; font-size: 23px; }
      #modal-monk-name { margin-bottom: 22px; font-size: 27px; }
      .modal-icon { width: 132px; height: 132px; margin-bottom: 22px; }
      #modal-monk-desc { font-size: 16px; line-height: 1.5; text-align: center; }
      .modal-close {
        position: fixed; top: max(10px, calc(14dvh - 54px)); left: 18px; right: auto;
        width: 44px; height: 44px; border-radius: 50%; background: white;
        box-shadow: 0 2px 10px rgba(0,0,0,.08);
      }
      body.monk-modal-open .app-header { display: none; }
      .modal-footer {
        display: flex; flex: 0 0 auto; gap: 8px; justify-content: center;
        padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
        border-top: 0; background: white;
      }
      .modal-gmaps, .modal-close-action {
        display: inline-flex; flex: 1; align-items: center; justify-content: center; gap: 9px;
        min-height: 46px; padding: 10px 12px; border: 0; border-radius: 999px;
        font: 500 15px Inter, sans-serif; text-decoration: none;
      }
      .modal-gmaps { background: #f0ede6; color: #171717; }
      .modal-close-action { background: #171717; color: white; cursor: pointer; }
      .monk-detail-modal .modal-close { display: grid; }
    }
    @media (max-width: 430px) {
      .app-title { max-width: 240px; }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Map showing monastery locations"></div>
  <div id="mobile-card-overlay" hidden></div>

  <header class="app-header">
    <h1 class="app-title">13 Assyrian fathers in Georgia</h1>
    <div class="header-actions">
      <button id="reset-btn" class="reset-btn" type="button">Overview map</button>
      <div class="language-switch" aria-hidden="true">
        <span>🇬🇧</span><span>🇬🇪</span><span>🇷🇺</span>
      </div>
      <button id="mobile-list-toggle" class="mobile-list-toggle" type="button" aria-label="Open monastery list" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </header>

  <main class="main-layout">
    <aside class="monks-panel" aria-label="Monastery list">
      <button id="mobile-list-close" class="mobile-list-close" type="button" aria-label="Close monastery list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="m18 6-12 12M6 6l12 12"></path>
        </svg>
      </button>
      <h2 class="panel-intro">13 Assyrian fathers in Georgia</h2>
      <button id="mobile-reset-btn" class="mobile-reset-btn" type="button">Reset map</button>
      <label class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="search-input" type="search" placeholder="Search" aria-label="Search by monk, monastery, or region">
      </label>
      <span id="counter" aria-live="polite">0 monasteries</span>
      <div id="monks-list"></div>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>

  <section id="monk-detail-modal" class="monk-detail-modal hidden" aria-modal="true" role="dialog" aria-labelledby="modal-monk-name">
    <button id="close-modal-btn" class="modal-close" type="button" aria-label="Close">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
        <path d="m18 6-12 12M6 6l12 12"></path>
      </svg>
    </button>
    <div class="modal-content">
      <span id="modal-monk-index">2</span>
      <h2 id="modal-monk-name">Anton of Martqopi</h2>
      <img id="modal-monk-icon" class="modal-icon" src="" alt="">
      <div id="modal-monk-desc"></div>
    </div>
    <div class="desktop-detail-nav" aria-label="Browse monks">
      <button id="detail-prev" type="button" aria-label="Previous monk">‹</button>
      <button id="detail-next" type="button" aria-label="Next monk">›</button>
    </div>
    <div class="modal-footer">
      <a id="modal-monk-gmaps" class="modal-gmaps" href="#" target="_blank" rel="noopener noreferrer">
        <span>Open in Google Maps</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M14 3h7v7M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        </svg>
      </a>
      <button id="modal-close-action" class="modal-close-action" type="button">Close</button>
    </div>
  </section>
</body>
</html>
