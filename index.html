<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13 Assyrian Monks in Georgia</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>

  <!-- Google Fonts: Cinzel & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Cinzel', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Кастомный тонкий скроллбар */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1ede4;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbbba6;
      border-radius: 9999px;
    }

    /* Маркеры монастырей */
    .custom-marker {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #92400e;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fef3c7;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .custom-marker:hover, .custom-marker.active {
      transform: scale(1.35);
      background: #b45309;
      border-color: #fef3c7;
      z-index: 50;
    }

    /* Попап Mapbox */
    .mapboxgl-popup-content {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 12px 24px -4px rgba(0,0,0,0.18);
      font-family: 'Inter', sans-serif;
      max-width: 290px;
      border: 1px solid #ebd9c8;
    }
    .mapboxgl-popup-close-button {
      padding: 4px 8px;
      font-size: 16px;
      color: #78716c;
    }
  </style>
</head>
<body class="bg-[#f7f4ee] text-stone-800 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-stone-900 text-stone-100 px-5 py-3 border-b border-stone-800 shrink-0 flex items-center justify-between z-20 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-full bg-amber-700 border border-amber-500/40 flex items-center justify-center text-amber-200 shrink-0">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M7 8h10M8 15h8"/></svg>
      </div>
      <div>
        <h1 class="font-serif text-base md:text-lg font-bold tracking-wide text-amber-100">13 Assyrian Monks in Georgia</h1>
        <p class="text-[11px] text-stone-400">6th Century Christian Missionaries & Monastic Founders</p>
      </div>
    </div>
    <div class="hidden sm:flex items-center space-x-2 text-xs text-amber-200/80 bg-stone-800 px-3 py-1.5 rounded-full border border-stone-700">
      <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      <span>Kartli & Kakheti Wilderness</span>
    </div>
  </header>

  <!-- Filter & Search Bar -->
  <section class="bg-[#eee8dc] px-4 py-2 border-b border-stone-300 flex flex-wrap gap-2 items-center justify-between text-xs shrink-0 z-20">
    <div class="relative flex-1 min-w-[200px] max-w-sm">
      <input 
        id="search-input" 
        type="text" 
        placeholder="Filter by monk, monastery, or region..." 
        class="w-full bg-white pl-8 pr-3 py-1.5 rounded-md border border-stone-300 focus:outline-none focus:ring-1 focus:ring-amber-600 text-stone-700 shadow-sm"
      />
      <svg class="w-3.5 h-3.5 text-stone-400 absolute left-2.5 top-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
    <div class="flex items-center gap-2">
      <button 
        id="reset-btn"
        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-md bg-stone-200/90 hover:bg-stone-300 text-stone-700 font-medium transition cursor-pointer text-xs"
      >
        <svg class="w-3.5 h-3.5 text-amber-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Reset View</span>
      </button>
      <span id="counter" class="text-stone-500 font-medium text-xs">13 Monasteries</span>
    </div>
  </section>

  <!-- Main Content Layout -->
  <!-- Mobile: Cards on top (flex-1), Map on bottom (40vh) -->
  <!-- Desktop: Split screen (Cards on left, Map on right) -->
  <main class="flex-1 flex flex-col md:flex-row min-h-0 relative overflow-hidden">
    
    <!-- Left Column: Cards List -->
    <div class="order-1 flex-1 md:flex-initial md:w-[440px] lg:w-[480px] h-full overflow-y-auto p-3.5 space-y-3 bg-[#f7f4ee] border-b md:border-b-0 md:border-r border-stone-300">
      <div id="monks-list" class="space-y-3">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Right Column: Interactive Map -->
    <div class="order-2 h-[40vh] md:h-full flex-1 relative bg-stone-200">
      <div id="map" class="w-full h-full"></div>
    </div>

  </main>

  <script>
    // -------------------------------------------------------------
    // Mapbox Token
    // -------------------------------------------------------------
    const MAPBOX_TOKEN = 'pk.eyJ1Ijoic2hlbGVuYXNoZXYiLCJhIjoiY212anhlcGk0MDlyMjJ4czk2Z20yazJvdSJ9.XDfXRGzxSVT3SIbw7dYh_Q';

    // -------------------------------------------------------------
    // Data Array: All 13 Assyrian Fathers [lng, lat]
    // -------------------------------------------------------------
    const assyrianFathers = [
      {
        id: "ioane-zedazeni",
        name: "Ioane of Zedazeni (John)",
        monastery: "Zedazeni Monastery",
        georgianName: "იოანე ზედაზნელი",
        region: "Mtskheta-Mtianeti",
        coordinates: [44.7644, 41.8711],
        notable: "Leader of the mission from Mesopotamia in the mid-6th century. Chose Mount Zedazeni north of Mtskheta, a former pagan shrine of Zadeni. Lived in ascetic solitude with bears as companions; a healing spring gushed forth through his prayers.",
        martyrdom: "Died peacefully around 573 AD after blessing his disciples to establish monastic centers throughout Georgia. Buried inside Zedazeni Monastery Church."
      },
      {
        id: "davit-gareja",
        name: "Davit of Gareja (David Garejeli)",
        monastery: "David Gareja Lavra & Caves",
        georgianName: "დავით გარეჯელი",
        region: "Kakheti (Gareja Desert)",
        coordinates: [45.3761, 41.4472],
        notable: "Initially dwelt on Mount Mtatsminda in Tbilisi, then retreated south into the harsh desert of Gareja where he drank milk from wild deer and established a massive cave monastery.",
        martyrdom: "Reposed in peace in extreme old age. Renowned for refusing to enter Jerusalem in person out of humility, only taking three holy stones from its gate."
      },
      {
        id: "shio-mgvime",
        name: "Shio of Mgvime (Shio-Mgvimeli)",
        monastery: "Shio-Mgvime Monastery",
        georgianName: "შიო მღვიმელი",
        region: "Mtskheta-Mtianeti",
        coordinates: [44.6403, 41.8625],
        notable: "Lived in a remote limestone canyon near Mtskheta. Fed miraculously by a dove; converted local prince Evagrius. Thousands gathered to form Georgia's largest monastery.",
        martyrdom: "Voluntarily spent the last 15 years of his earthly life sealed deep in an underground pit tomb in ceaseless contemplative prayer until his peaceful repose."
      },
      {
        id: "abibos-nekresi",
        name: "Abibos of Nekresi (Abibus)",
        monastery: "Nekresi Monastery",
        georgianName: "აბიბოს ნეკრესელი",
        region: "Kakheti (Alazani Valley)",
        coordinates: [45.7675, 41.9723],
        notable: "Consecrated Bishop of Nekresi. Zealous evangelist among Caucasian highlanders who vigorously combated Zoroastrian Persian fire-worship, extinguishing a sacred fire with water.",
        martyrdom: "Martyred: Captured by the Persian Marzban, scourged, dragged through streets, and stoned to death near Rekhi. His holy relics rest in Samtavro Cathedral, Mtskheta."
      },
      {
        id: "anton-martqopi",
        name: "Anton of Martqopi (Anthony)",
        monastery: "Martqopi Monastery",
        georgianName: "ანტონ მარტყოფელი",
        region: "Kvemo Kartli",
        coordinates: [45.0294, 41.7892],
        notable: "Brought an authentic 'Image Not-Made-By-Hands' (Mandylion) of Christ on a tile to Georgia. Lived in secluded woods where wild deer visited him; later climbed a stone pillar tower.",
        martyrdom: "Spent his final 15 years in prayer atop his pillar as a solitary stylite, reposing peacefully around 590 AD. Buried under his pillar tower."
      },
      {
        id: "stepane-khirsa",
        name: "Stephane of Khirsa (Stephen)",
        monastery: "Khirsa Monastery of St. Stephen",
        georgianName: "სტეფანე ხირსელი",
        region: "Kakheti (Signagi)",
        coordinates: [45.8944, 41.5794],
        notable: "Sent east into fertile Kakheti. Built a major cathedral dedicated to Archdeacon Stephen near the Khirsa river, converting and baptizing thousands of residents.",
        martyrdom: "Passed away peacefully after a long life devoted to missionary labor; his tomb is preserved near the altar in Khirsa Cathedral."
      },
      {
        id: "zenon-ikhalto",
        name: "Zenon of Ikhalto (Zeno)",
        monastery: "Ikhalto Monastery & Academy",
        georgianName: "ზენონ იყალთოელი",
        region: "Kakheti (Telavi)",
        coordinates: [45.3802, 41.9372],
        notable: "Founded the Holy Transfiguration cloister near Telavi, laying spiritual foundations for what later became Georgia's paramount Academy of philosophy and science.",
        martyrdom: "Reposed in peace of old age; enshrined within the Church of the Holy Spirit at Ikhalto."
      },
      {
        id: "ioseb-alaverdi",
        name: "Ioseb of Alaverdi (Joseph)",
        monastery: "Alaverdi Cathedral",
        georgianName: "იოსებ ალავერდელი",
        region: "Kakheti (Akhmeta)",
        coordinates: [45.3670, 42.0108],
        notable: "Settled in the wild plains of Alaverdi. Preached with profound gentleness to locals, founding the hermitage that later grew into the monumental 11th-century Alaverdi Cathedral.",
        martyrdom: "Fell asleep in the Lord peacefully in 570 AD. His tomb became an ancient center of mass pilgrimage across the Caucasus."
      },
      {
        id: "isidor-samtavisi",
        name: "Isidore of Samtavisi",
        monastery: "Samtavisi Cathedral",
        georgianName: "ისიდორე სამთავნელი",
        region: "Shida Kartli (Kaspi)",
        coordinates: [44.4069, 41.9961],
        notable: "Established a monastic community on the banks of the Lekhura river. Renowned for boundless charity, miraculous healing, and spiritual discipline.",
        martyrdom: "Died peacefully; buried inside Samtavisi Cathedral, famed for its masterwork stone facade carvings."
      },
      {
        id: "tate-dzveli-shuamta",
        name: "Tate of Shuamta (Thaddaeus)",
        monastery: "Dzveli Shuamta Monastery",
        georgianName: "თათე ძველ-შუამთელი",
        region: "Kakheti (Gombori Pass)",
        coordinates: [45.4055, 41.9125],
        notable: "Preached the Gospel across Kakheti before settling in thick deciduous woods at the foot of Tsiv-Gombori mountains, building the early Christian basilica of Shuamta.",
        martyrdom: "Died in tranquility surrounded by loving disciples; revered as a protector of mountaineers and travelers."
      },
      {
        id: "mikhail-ulumbo",
        name: "Mikhail of Ulumbo (Michael)",
        monastery: "Ulumbo Monastery",
        georgianName: "მიქაელ ულუმბოელი",
        region: "Shida Kartli (Khashuri)",
        coordinates: [43.6820, 42.0520],
        notable: "Vigorous preacher of orthodox Christian doctrine who established a flourishing spiritual center at Mount Ulumbo, overturning remaining pagan practices.",
        martyrdom: "Reposed in peace after establishing an influential monastic cloister; venerated for spiritual endurance."
      },
      {
        id: "piros-breti",
        name: "Piros of Breti (Pyrrhus)",
        monastery: "Breti Monastery",
        georgianName: "პიროზ ბრეთელი",
        region: "Shida Kartli (Kareli)",
        coordinates: [43.9161, 42.0633],
        notable: "Founded a monastic cloister at Breti near the Mtkvari valley. Renowned for unceasing empathy toward leprosy patients and the poor.",
        martyrdom: "Died peacefully after holy ascetic struggles; buried inside the Mother of God Church at Breti Monastery."
      },
      {
        id: "elise-tserovani",
        name: "Elise of Tserovani (Elisha)",
        monastery: "Tserovani Church & Hermitage",
        georgianName: "ელისე წეროვნელი",
        region: "Mtskheta-Mtianeti",
        coordinates: [44.6883, 41.8792],
        notable: "Established solitary prayer cells and churches in the valleys near Tserovani and Mtskheta, confirming local farmers in piety.",
        martyrdom: "Lived to extreme old age and passed into eternal rest in peace at his retreat in Tserovani."
      }
    ];

    let map;
    const markers = {};
    const sidebar = document.getElementById('monks-list');
    const counter = document.getElementById('counter');
    const searchInput = document.getElementById('search-input');
    const resetBtn = document.getElementById('reset-btn');

    function renderCards(list) {
      if (!sidebar) return;
      sidebar.innerHTML = '';

      if (list.length === 0) {
        sidebar.innerHTML = '<p class="text-center text-xs text-stone-500 py-8">No matching monks or monasteries found.</p>';
        if (counter) counter.innerText = `0 of ${assyrianFathers.length} Monasteries`;
        return;
      }

      list.forEach(father => {
        const isMartyr = father.martyrdom.toLowerCase().startsWith('martyred');
        const card = document.createElement('article');
        card.id = `card-${father.id}`;
        card.className = "p-3.5 rounded-xl border bg-white cursor-pointer shadow-sm hover:shadow-md hover:border-amber-500 transition duration-150 border-stone-200/90 text-xs";

        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <div class="flex items-center gap-1.5 mb-1">
                <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${isMartyr ? 'bg-red-50 text-red-800 border border-red-200' : 'bg-stone-100 text-stone-700 border border-stone-200'}">
                  ${father.region}
                </span>
                ${isMartyr ? '<span class="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-red-100 text-red-800">Hieromartyr</span>' : ''}
              </div>
              <h2 class="font-serif font-bold text-sm text-stone-900 transition">
                ${father.name}
              </h2>
              <div class="text-[11px] text-stone-500 italic mb-2">
                <span>${father.georgianName}</span> • <span class="font-semibold text-amber-800 not-italic">${father.monastery}</span>
              </div>
            </div>
            <button class="p-1.5 rounded-lg bg-stone-100 text-stone-500 hover:text-amber-800 shrink-0" title="Fly to location">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </button>
          </div>
          <p class="text-stone-600 leading-relaxed mt-1 mb-2">
            ${father.notable}
          </p>
          <div class="pt-2 border-t border-stone-100 text-[11px] ${isMartyr ? 'text-red-900 font-medium' : 'text-stone-500'}">
            <strong>Repose / Martyrdom:</strong> ${father.martyrdom}
          </div>
        `;

        card.addEventListener('click', () => {
          selectFather(father.id, true);
        });

        sidebar.appendChild(card);
      });

      if (counter) counter.innerText = `${list.length} of ${assyrianFathers.length} Monasteries`;
    }

    function initMapbox() {
      mapboxgl.accessToken = MAPBOX_TOKEN;

      map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/outdoors-v12',
        center: [44.95, 41.85],
        zoom: 8.5
      });

      map.addControl(new mapboxgl.NavigationControl(), 'top-right');

      assyrianFathers.forEach(father => {
        const isMartyr = father.martyrdom.toLowerCase().startsWith('martyred');
        const el = document.createElement('div');
        el.className = 'custom-marker';
        el.id = `marker-${father.id}`;
        if (isMartyr) {
          el.style.backgroundColor = '#991b1b';
        }
        el.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 2v20M7 8h10M8 15h8"/></svg>`;

        const popup = new mapboxgl.Popup({ offset: 20 }).setHTML(`
          <div class="text-stone-800 text-xs">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="text-[9px] font-bold uppercase tracking-wider px-1.5 py-0.5 rounded ${isMartyr ? 'bg-red-100 text-red-800' : 'bg-stone-100 text-stone-700'}">${father.region}</span>
              ${isMartyr ? '<span class="text-[9px] font-bold uppercase px-1.5 py-0.5 rounded bg-red-800 text-white">Hieromartyr</span>' : ''}
            </div>
            <h3 class="font-serif font-bold text-sm text-stone-900 leading-tight mb-0.5">${father.name}</h3>
            <div class="text-[11px] text-stone-500 italic mb-2">${father.georgianName} • <span class="font-semibold text-amber-900 not-italic">${father.monastery}</span></div>
            <p class="text-stone-600 leading-relaxed mb-2">${father.notable}</p>
            <div class="pt-2 border-t border-stone-200 text-[10px] ${isMartyr ? 'text-red-800 font-medium' : 'text-stone-500'}">
              <strong>Repose:</strong> ${father.martyrdom}
            </div>
          </div>
        `);

        const marker = new mapboxgl.Marker(el)
          .setLngLat(father.coordinates)
          .setPopup(popup)
          .addTo(map);

        el.addEventListener('click', () => {
          selectFather(father.id, false);
        });

        markers[father.id] = { marker, popup, coords: father.coordinates };
      });
    }

    function selectFather(id, shouldFly = true) {
      const father = assyrianFathers.find(f => f.id === id);
      if (!father) return;

      document.querySelectorAll('#monks-list article').forEach(el => {
        el.classList.remove('ring-2', 'ring-amber-700', 'bg-amber-50/40', 'border-amber-500');
      });
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('ring-2', 'ring-amber-700', 'bg-amber-50/40', 'border-amber-500');
        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      document.querySelectorAll('.custom-marker').forEach(m => m.classList.remove('active'));
      const activeMarker = document.getElementById(`marker-${id}`);
      if (activeMarker) activeMarker.classList.add('active');

      if (map && markers[id]) {
        if (shouldFly) {
          map.flyTo({
            center: father.coordinates,
            zoom: 12.5,
            duration: 1400,
            essential: true
          });
        }
        markers[id].marker.togglePopup();
      }
    }

    function resetView() {
      if (!map) return;
      map.flyTo({ center: [44.95, 41.85], zoom: 8.5, duration: 1000 });
      document.querySelectorAll('#monks-list article').forEach(el => {
        el.classList.remove('ring-2', 'ring-amber-700', 'bg-amber-50/40', 'border-amber-500');
      });
      document.querySelectorAll('.custom-marker').forEach(m => m.classList.remove('active'));
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      const filtered = assyrianFathers.filter(f => 
        f.name.toLowerCase().includes(q) ||
        f.monastery.toLowerCase().includes(q) ||
        f.georgianName.toLowerCase().includes(q) ||
        f.region.toLowerCase().includes(q) ||
        f.notable.toLowerCase().includes(q) ||
        f.martyrdom.toLowerCase().includes(q)
      );

      renderCards(filtered);

      assyrianFathers.forEach(f => {
        const item = markers[f.id];
        if (!item) return;
        const matches = filtered.some(match => match.id === f.id);
        item.marker.getElement().style.display = matches ? 'flex' : 'none';
      });
    }

    // Direct execution
    renderCards(assyrianFathers);
    initMapbox();

    if (searchInput) {
      searchInput.addEventListener('input', (e) => handleSearch(e.target.value));
    }
    if (resetBtn) {
      resetBtn.addEventListener('click', resetView);
    }
  </script>
</body>
</html>
