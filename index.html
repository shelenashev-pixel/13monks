<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>13 Assyrian Monks in Georgia</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Google Fonts: Prata & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Prata&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['Prata', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
          }
          .monk-skeleton { flex-basis: 62px; }
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --surface-canvas: #e0d5c1;
      --surface-panel: #ffffff;
      --surface-base: #ffffff;
      --surface-soft: #f5f2eb;
      --surface-hover: #ebe6da;
      --surface-inverse: #1a1a1a;
      --surface-input: #e9e7e2;
      --text-primary: #1a1a1a;
      --text-secondary: #727272;
      --text-inverse: #ffffff;
      --border-selected: #4d4d4d;
      --action-primary-hover: #333333;
      --paper: var(--surface-soft);
      --ink: var(--text-primary);
      --muted: var(--text-secondary);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-s: 12px;
      --radius-m: 20px;
      --radius-card: 16px;
      --radius-pill: 999px;
      --control-height-s: 32px;
      --control-height-m: 40px;
      --control-height-l: 48px;
      --motion-standard: cubic-bezier(.22, 1, .36, 1);
      --ease-ui: cubic-bezier(.4, 0, .2, 1);
    }

    * { box-sizing: border-box; }
    html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: var(--surface-canvas);
    }
    body {
      margin: 0; padding: 0; width: 100%; height: 100lvh;
      position: relative; background-color: var(--surface-canvas); overscroll-behavior: none;
    }
    .hidden, [hidden] { display: none !important; }
    button {
      box-sizing: border-box; display: inline-flex; align-items: center;
      justify-content: center; white-space: nowrap; line-height: 1;
    }
    button, a, [role="button"], input, .monk-card {
      transition:
        background-color .3s var(--ease-ui), color .3s var(--ease-ui), border-color .3s var(--ease-ui),
        box-shadow .3s var(--ease-ui), opacity .3s var(--ease-ui), transform .3s var(--ease-ui);
    }
    /* MapLibre positions markers via transform; animating it makes pins lag behind the map. */
    .map-pin-wrap { transition: none; }
    button:focus-visible, a:focus-visible, [role="button"]:focus-visible, input:focus-visible {
      outline: 2px solid #6f5636; outline-offset: 3px;
    }
    .monk-popup-gmaps:focus-visible, .modal-gmaps:focus-visible { outline: none; }
    /* Single source: edit/re-export images/ui-icons/<name>.svg and every icon updates. */
    .icon {
      display: inline-block; flex-shrink: 0; width: 24px; height: 24px; background-color: currentColor;
      -webkit-mask: var(--icon) center / contain no-repeat; mask: var(--icon) center / contain no-repeat;
    }
    .icon-menu { --icon: url('./images/ui-icons/menu.svg'); }
    .icon-close { --icon: url('./images/ui-icons/close.svg'); }
    .icon-search { --icon: url('./images/ui-icons/search.svg'); }
    .icon-arrow-left { --icon: url('./images/ui-icons/arrow-left.svg'); }
    .icon-arrow-right { --icon: url('./images/ui-icons/arrow-right.svg'); }
    .icon-cross { --icon: url('./images/ui-icons/cross.svg'); }
    .icon-map-pin { --icon: url('./images/ui-icons/map-pin.svg'); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: transparent; border-radius: 9999px; }
    #monks-list:hover::-webkit-scrollbar-thumb,
    .modal-content:hover::-webkit-scrollbar-thumb { background: #c9c6bd; }

    #map {
      position: absolute !important;
      top: 0 !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      width: 100vw !important;
      height: 100lvh !important;
      background-color: var(--surface-canvas);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #e0d5c1 0%,
        rgba(224, 213, 193, 0) 36px,
        rgba(224, 213, 193, 0) calc(100% - 36px),
        #e0d5c1 100%
      );
    }
    .app-header {
      position: fixed; z-index: 20; inset: 0 0 auto; min-height: 72px;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 12px 16px; pointer-events: none;
    }
    .app-title {
      margin: 0; color: var(--ink); font: 400 clamp(26px, 3.4vw, 43px)/1.1 'Prata', Georgia, serif;
      letter-spacing: -1.2px; text-shadow: 0 1px 8px rgba(255,255,255,.38);
      max-width: 620px;
    }
    .header-actions { display: flex; align-items: center; gap: var(--space-3); pointer-events: auto; }
    .reset-btn {
      display: inline-flex; height: var(--control-height-m); min-width: 0;
      padding: var(--space-2) var(--space-6); border: 0; border-radius: var(--radius-pill);
      background: var(--surface-inverse); color: var(--text-inverse); font: 600 14px Inter, sans-serif; cursor: pointer;
    }
    .reset-btn:hover { background: var(--action-primary-hover); }
    .language-switch {
      display: flex; width: var(--control-height-m); height: var(--control-height-m);
      align-items: center; justify-content: center; gap: 4px; padding: var(--space-2);
      border: 0; border-radius: var(--radius-pill); background: var(--surface-base);
    }
    .language-switch span {
      display: grid; width: 30px; height: 30px; place-items: center;
      border-radius: 50%; font-size: 20px; line-height: 16px;
    }
    .mobile-list-toggle, .mobile-list-close, .mobile-reset-btn { display: none; }

    .monks-panel {
      position: fixed; z-index: 10; top: 82px; bottom: 16px; left: 16px;
      display: flex; flex-direction: column; gap: var(--space-4);
      width: min(434px, calc(100vw - 32px)); padding: var(--space-4);
      border: 1px solid rgba(255,255,255,.8); border-radius: 16px;
      background: #f7f5ef; box-shadow: 0 10px 28px rgba(36,31,24,.08);
    }
    .panel-intro {
      flex: 0 0 auto; display: flex; align-items: center; margin: 0; padding: 8px 0;
      border: 0; border-radius: 0; color: var(--ink);
      background: transparent; font: 400 clamp(28px, 2.8vw, 39px)/1.08 'Prata', Georgia, serif;
      letter-spacing: -.8px;
    }
    .search-wrap {
      position: relative; flex: 0 0 var(--control-height-m);
      height: var(--control-height-m);
    }
    .search-icon {
      position: absolute; top: 8px; left: 10px;
      color: var(--text-primary); pointer-events: none;
    }
    #search-input {
      width: 100%; height: 100%; padding: 0 var(--space-4) 0 44px; outline: none;
      border: 2px solid var(--text-secondary); border-radius: var(--radius-pill); background: transparent;
      color: var(--text-primary); font: 14px/20px Inter, sans-serif;
    }
    #search-input:focus { border-color: var(--text-primary); }
    #search-input:focus-visible { outline: 2px solid #6f5636; outline-offset: 2px; }
    #search-input::placeholder { color: var(--text-secondary); }
    #monks-list { display: flex; flex: 1; flex-direction: column; gap: var(--space-3); min-height: 0; overflow-y: auto; padding: 0 4px 2px 0; margin-right: calc(6px - var(--space-4)); }
    .empty-state {
      display: flex; align-items: center; justify-content: center; min-height: 180px; padding: 20px 16px;
    }
    .empty-state-card {
      width: 100%; padding: 20px 18px; border: 1px solid #e6e0d7; border-radius: 12px; background: rgba(255,255,255,.72); text-align: center;
    }
    .empty-state-card h3 { margin: 0 0 8px; color: #171717; font: 400 24px/1.2 'Prata', Georgia, serif; }
    .empty-state-card p { margin: 0 0 14px; color: #666; font: 13px/1.5 Inter, sans-serif; }
    .empty-state-action {
      display: inline-flex; height: var(--control-height-m); padding: 0 16px;
      border: 0; border-radius: var(--radius-pill); background: #171717;
      color: white; font: 600 12px Inter, sans-serif; cursor: pointer;
    }
    .monk-skeleton {
      position: relative; flex: 0 0 70px; overflow: hidden; border-radius: 12px;
      background: #f1efeb;
    }
    .monk-skeleton::after {
      position: absolute; inset: 0; content: "";
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      transform: translateX(-100%); animation: skeleton-shimmer 1.4s ease-in-out infinite;
    }
    @keyframes skeleton-shimmer { to { transform: translateX(100%); } }
    .app-status {
      position: fixed; z-index: 40; bottom: 24px; left: 50%;
      display: flex; align-items: center; gap: var(--space-3); max-width: calc(100vw - 32px);
      padding: var(--space-3) var(--space-4); transform: translateX(-50%);
      border: 1px solid rgba(17,17,17,.08); border-radius: 12px;
      background: var(--surface-panel); color: var(--text-primary);
      box-shadow: 0 8px 24px rgba(17,17,17,.12);
      font: 13px/1.4 Inter, sans-serif;
    }
    .app-status::before {
      width: 18px; height: 18px; flex: 0 0 18px; content: "";
      border: 2px solid #ded9cf; border-top-color: #6f5636; border-radius: 50%;
      animation: status-spin .8s linear infinite;
    }
    @keyframes status-spin { to { transform: rotate(360deg); } }
    .app-status.is-error {
      top: 50%; bottom: auto; flex-wrap: wrap; width: min(380px, calc(100vw - 32px));
      padding: var(--space-6); transform: translate(-50%, -50%);
    }
    .app-status.is-error::before { display: none; }
    .app-status-retry {
      display: inline-flex; height: var(--control-height-m); margin-left: auto;
      padding: 0 16px; border: 0; border-radius: var(--radius-pill);
      background: #171717; color: #fff; font: 500 12px Inter, sans-serif; cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important; animation-duration: .01ms !important;
        animation-iteration-count: 1 !important; transition-duration: .01ms !important;
      }
    }
    #counter { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .map-pin-wrap { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
    .map-pin {
      display: flex; width: 32px; height: 32px; align-items: center; justify-content: center; border-radius: 50%;
      background: var(--surface-base); color: var(--text-primary);
      filter: drop-shadow(0 4px 8px rgba(17,17,17,.22));
      transition: background-color .3s var(--ease-ui), color .3s var(--ease-ui);
    }
    .map-pin .icon { width: 24px; height: 24px; }
    .map-pin.is-active { background: var(--surface-inverse); color: var(--text-inverse); }
    .map-pin-wrap:focus-visible {
      border-radius: 50%; outline: 2px solid #6f5636; outline-offset: 3px;
    }

    .monk-card {
      display: grid; flex: 0 0 64px; grid-template-columns: 24px 48px minmax(0,1fr);
      align-items: center; gap: var(--space-3); width: 100%; height: 64px; padding: var(--space-2) var(--space-4);
      border: 0; border-radius: 8px; background: transparent; color: var(--text-primary); cursor: pointer;
      cursor: pointer;
    }
    .monk-card:hover { background: var(--surface-hover); }
    #monks-list:has(.monk-card[aria-current="true"]) .monk-card:hover { background: var(--surface-hover); }
    #monks-list .monk-card[aria-current="true"] {
      background: var(--surface-base); box-shadow: inset 0 0 0 2px var(--border-selected);
    }
    #monks-list .monk-card[aria-current="true"]:hover { background: var(--surface-base); }
    .card-number { padding-top: 4px; color: var(--text-primary); font: 400 20px/24px 'Prata', Georgia, serif; text-align: center; }
    .card-icon-frame {
      position: relative; display: grid; width: 48px; height: 48px; overflow: hidden; place-items: center;
      border-radius: 50%; background: #e8e6e0; color: #8a8882;
    }
    .card-icon-frame::after {
      position: absolute; content: ''; width: 24px; height: 24px; background-color: currentColor;
      -webkit-mask: url('./images/ui-icons/cross.svg') center / contain no-repeat;
      mask: url('./images/ui-icons/cross.svg') center / contain no-repeat;
    }
    .card-icon-frame img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; }
    .card-copy { min-width: 0; text-align: center; }
    .card-copy h3 {
      overflow: hidden; margin: 0; color: var(--text-primary); font: 400 16px/20px 'Prata', Georgia, serif;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .card-copy p { overflow: hidden; margin: 0; color: var(--text-secondary); font: 14px/20px Inter, sans-serif; text-overflow: ellipsis; white-space: nowrap; }

    .detail-overlay {
      position: fixed; top: 84px; bottom: 16px;
      left: calc(32px + min(434px, calc(100vw - 32px)));
      width: min(434px, calc(100vw - min(434px, calc(100vw - 32px)) - 48px));
      pointer-events: none;
    }
    .monk-detail-modal {
      position: absolute; z-index: 30; inset: 0;
      display: flex; width: 100%; max-height: none; pointer-events: auto;
      flex-direction: column; overflow: hidden;
      border: 0; border-radius: var(--radius-s); background: var(--surface-base);
      transition: opacity .2s, transform .2s;
    }
    .modal-content { flex: 1; overflow-y: auto; margin-right: 6px; padding: var(--space-6) 10px 96px var(--space-4); text-align: center; }
    @keyframes detail-card-enter-next {
      from { transform: translateX(100vw); }
      to { transform: translateX(0); }
    }
    @keyframes detail-card-enter-previous {
      from { transform: translateX(-100vw); }
      to { transform: translateX(0); }
    }
    @keyframes detail-card-exit-next {
      from { transform: translateX(0); }
      to { transform: translateX(-100vw); }
    }
    @keyframes detail-card-exit-previous {
      from { transform: translateX(0); }
      to { transform: translateX(100vw); }
    }
    .modal-close {
      position: absolute; top: 13px; right: 14px; z-index: 2; display: inline-flex;
      width: 34px; height: 34px; place-items: center; padding: 0; border: 0;
      background: transparent; color: #111; cursor: pointer; pointer-events: auto;
    }
    .modal-close:hover { color: #777; }
    #modal-monk-index { display: block; margin-bottom: var(--space-6); color: var(--text-primary); font: 400 16px/20px 'Prata', Georgia, serif; }
    #modal-monk-name { margin: 0 0 var(--space-6); color: var(--text-primary); font: 400 24px/28px 'Prata', Georgia, serif; }
    .modal-icon-frame {
      position: relative; display: grid; width: 160px; height: 160px; margin: 0 auto var(--space-6);
      overflow: hidden; place-items: center; border: 0;
      border-radius: 50%; background: #eeece8;
    }
    .modal-icon { display: block; width: 100%; height: 100%; object-fit: cover; }
    .modal-icon-fallback { display: none; width: 42px; height: 42px; color: #777; }
    .modal-icon-frame.is-missing .modal-icon { display: none; }
    .modal-icon-frame.is-missing .modal-icon-fallback { display: block; }
    #modal-monk-desc { margin: 0; color: var(--text-primary); font: 14px/20px Inter, sans-serif; text-align: left; }
    #modal-monk-desc section { text-align: left; }
    #modal-monk-desc section + section { margin-top: var(--space-6); }
    #modal-monk-desc h3 {
      margin: 0 0 var(--space-2); color: var(--text-primary); font: 400 16px/20px 'Prata', Georgia, serif;
    }
    #modal-monk-desc p + p { margin-top: var(--space-2); }
    #modal-monk-desc strong { color: var(--text-primary); }
    .monk-popup-gmaps {
      display: inline-flex; height: var(--control-height-m); align-items: center; justify-content: center; gap: var(--space-3);
      padding: var(--space-2) var(--space-3) var(--space-2) var(--space-5); border-radius: var(--radius-pill);
      background: var(--surface-soft); color: var(--text-primary); font: 600 14px Inter, sans-serif;
      text-decoration: none;
    }
    .monk-popup-gmaps:hover { background: var(--surface-hover); }
    .modal-footer { display: none; }
    .modal-side-preview { display: none; }
    .desktop-detail-nav { display: none; }

    .maplibregl-popup { max-width: none !important; }
    .maplibregl-popup-content {
      width: 296px; padding: 0 !important; overflow: visible; border-radius: 0;
      background: transparent !important; box-shadow: none !important;
      font-family: Inter, sans-serif;
    }
    .place-card-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); user-select: none; }
    .place-card {
      display: flex; width: 100%; height: 264px; flex-direction: column; overflow: hidden;
      border-radius: var(--radius-m); background: var(--surface-base);
    }
    .place-card-image { flex: 0 0 132px; height: 132px; overflow: hidden; background: #e8e6e0; }
    .place-card-image img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .place-card-body {
      display: flex; flex: 1; min-height: 0; flex-direction: column; align-items: center;
      gap: var(--space-3); padding: var(--space-5) var(--space-4) var(--space-4);
    }
    .place-card-text { display: flex; width: 100%; flex-direction: column; align-items: center; gap: var(--space-1); }
    .place-card-title { margin: 0; color: var(--text-primary); font: 400 16px/20px 'Prata', Georgia, serif; white-space: nowrap; }
    .place-card-region { color: var(--text-secondary); font: 400 14px/20px Inter, sans-serif; white-space: nowrap; }
    .place-card-close {
      display: inline-flex; width: var(--control-height-s); height: var(--control-height-s); align-items: center; justify-content: center;
      border-radius: var(--radius-pill); pointer-events: none;
      background: var(--surface-inverse); color: var(--text-inverse);
    }
    .maplibregl-popup-close-button {
      z-index: 2; padding: 3px 8px; color: #fff !important; font-size: 19px;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    .maplibregl-popup-tip { display: none; }

    @media (min-width: 761px) {
      .maplibregl-popup-close-button { display: none; }
      .app-header {
        align-items: center; gap: var(--space-3); min-height: 88px; padding: var(--space-6);
        background:
          linear-gradient(to bottom, var(--surface-soft), rgba(245,242,235,0) 50%),
          linear-gradient(to bottom, #ebe6da, rgba(235,230,218,0));
      }
      .app-header .app-title {
        min-width: 0; max-width: none; flex: 1; overflow: hidden; text-overflow: ellipsis;
        color: var(--text-primary); font: 400 40px/40px 'Prata', Georgia, serif; letter-spacing: 0;
        text-shadow: none; white-space: nowrap;
      }
      .header-actions { align-items: center; gap: var(--space-6); }
      .header-actions .language-switch {
        order: 1; display: grid; width: var(--control-height-m); height: var(--control-height-m);
        padding: 0; place-items: center; border-radius: var(--radius-pill);
      }
      .header-actions .reset-btn { order: 2; }
      .header-actions .language-switch span:not(:first-child) { display: none; }
      .header-actions .language-switch span:first-child { width: 100%; height: 100%; }
      .monks-panel {
        top: 88px; bottom: 16px; left: 16px; width: min(340px, calc(100vw - 32px));
        gap: var(--space-3); padding: var(--space-5) var(--space-4) var(--space-4);
        border: 2px solid var(--surface-soft); border-radius: var(--radius-s); background: var(--surface-soft);
        box-shadow: none;
      }
      .panel-intro { display: none; }
      .detail-overlay {
        top: 88px; bottom: 16px;
        left: calc(32px + min(340px, calc(100vw - 32px)));
        width: min(380px, calc(100vw - min(340px, calc(100vw - 32px)) - 48px));
      }
      .monk-detail-modal {
        width: 100%;
        border-radius: var(--radius-s); background: var(--surface-base);
      }
      .modal-transition-outgoing { display: none !important; }
      .modal-content { padding: var(--space-6) 10px 96px var(--space-4); }
      .desktop-detail-nav {
        position: absolute; right: 0; bottom: 0; left: 0; z-index: 2;
        display: flex; justify-content: center; gap: var(--space-3); padding: var(--space-3) 0; pointer-events: none;
        background: linear-gradient(to top, var(--surface-base), rgba(255,255,255,0));
      }
      .desktop-detail-nav button {
        display: inline-flex; width: var(--control-height-m); height: var(--control-height-m);
        border: 0; border-radius: var(--radius-pill); background: var(--surface-soft); color: var(--text-primary);
        align-items: center; justify-content: center; padding: var(--space-2);
        cursor: pointer; pointer-events: auto;
      }
      .desktop-detail-nav button:hover { background: var(--surface-hover); }
      #modal-monk-desc { text-align: center; }
      .monks-panel, .detail-overlay {
        transition: opacity .24s ease, transform .24s ease, visibility 0s;
      }
      .maplibregl-popup {
        transition: opacity .24s ease, visibility 0s;
      }
      body.map-only-view .monks-panel {
        opacity: 0; transform: translateX(-18px); visibility: hidden; pointer-events: none;
      }
      body.map-only-view .detail-overlay {
        opacity: 0; transform: translateX(18px); visibility: hidden; pointer-events: none;
      }
      body.map-only-view .maplibregl-popup {
        opacity: 0; visibility: hidden; pointer-events: none;
        transition-delay: 0s, .24s;
      }
    }

    @media (max-width: 760px) {
